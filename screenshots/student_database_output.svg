<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="790" viewBox="0 0 1060 790" role="img" aria-labelledby="title desc">
  <title id="title">Student database program in Windows Command Prompt</title>
  <desc id="desc">A sample student database session shown in a classic Windows Command Prompt window.</desc>
